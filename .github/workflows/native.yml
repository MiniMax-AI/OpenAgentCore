name: native-check

on:
  workflow_dispatch:
    inputs:
      upload-artifacts:
        description: Retain the Linux amd64 installer for packaging
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      upload-artifacts:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  platform:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - platform: linux-amd64
            runner: blacksmith-2vcpu-ubuntu-2204
            github-runner: ubuntu-22.04
          - platform: darwin-arm64
            runner: macos-15
            github-runner: macos-15
          - platform: windows-amd64
            runner: blacksmith-2vcpu-windows-2025
            github-runner: windows-2025
    name: platform (${{ matrix.platform }})
    runs-on: ${{ vars.OAC_USE_GITHUB_RUNNERS == 'true' && matrix.github-runner || matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and test the shared Core installer
        run: |
          go build -o "$RUNNER_TEMP/oac${{ runner.os == 'Windows' && '.exe' || '' }}" ./services/core/cmd/oac
          go test ./services/core/cmd/oac -count=1 -timeout=3m
      - name: Exercise the Windows Core launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/test_install.ps1 -Binary "$env:RUNNER_TEMP/oac.exe"
      - uses: actions/setup-node@v6
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Build the Linux amd64 launcher and Sandbox I/O
        if: runner.os == 'Linux'
        id: build
        run: |
          CGO_ENABLED=0 go build -ldflags "-X github.com/MiniMax-AI/OpenAgentCore/apps/daemon/internal/cli.Version=$(git rev-parse HEAD)" -o "$RUNNER_TEMP/oac-daemon" ./apps/daemon/cmd/oac-daemon
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/oac-sandbox-io" ./apps/sandboxio/cmd/oac-sandbox-io
          node --test scripts/build-native-installer.test.mjs scripts/build-native-catalog.test.mjs
      - name: Verify download recovery and launcher installation
        if: runner.os == 'Linux'
        id: files
        run: go test -race -count=1 ./services/core/internal/nativeinstaller ./apps/daemon/internal/cli ./apps/daemon/internal/daemonize ./apps/daemon/internal/agent/clirunner ./internal/runtimefs
      - name: Prepare Sandbox I/O directories
        if: runner.os == 'Linux'
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /environment/workspace /environment/initialization /environment/packages /home/runtime
      - name: Package and exercise launcher installation and reuse
        if: runner.os == 'Linux'
        id: package
        run: node scripts/build-native-installer-ci.mjs
      - name: Bootstrap, authenticate, install and connect
        if: runner.os == 'Linux'
        id: onboarding
        run: node scripts/native-onboarding-smoke.mjs
      - name: Archive the Linux amd64 installer
        if: runner.os == 'Linux'
        run: tar -C "$RUNNER_TEMP/native-installer" -czf "$RUNNER_TEMP/oac-native-installer-Linux-X64.tar.gz" .
      - uses: actions/upload-artifact@v6
        if: inputs.upload-artifacts && runner.os == 'Linux'
        with:
          name: oac-native-installer-Linux-X64
          path: ${{ runner.temp }}/oac-native-installer-Linux-X64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Record failed native check phases
        if: failure() && runner.os == 'Linux'
        env:
          PHASES: ${{ toJSON(steps) }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = join(process.env.RUNNER_TEMP, 'native-ci-diagnostics');
          mkdirSync(dir, { recursive: true });
          const phases = Object.fromEntries(Object.entries(JSON.parse(process.env.PHASES))
            .map(([name, step]) => [name, step.outcome]));
          writeFileSync(join(dir, 'phases.json'), JSON.stringify({ platform: process.env.PLATFORM, phases }, null, 2));
          JS
      - name: Retain native failure diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: native-diagnostics-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ci-diagnostics/
          retention-days: 7
          if-no-files-found: ignore

  core-intel-mac:
    name: Core installer (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./services/core/cmd/oac -count=1 -timeout=3m
      - run: go build -o "$RUNNER_TEMP/oac" ./services/core/cmd/oac
