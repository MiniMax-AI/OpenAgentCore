name: ci-web-acceptance

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable source commit to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  web-acceptance:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ${{ vars.OAC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/node
      - name: Install dependencies and Web acceptance browser
        run: |
          make node-deps
          pnpm exec playwright install --with-deps chrome
      - name: Verify Web workflows against isolated fixtures
        run: make check-web-acceptance OAC_WEB_TEST_SHARD=${{ matrix.shard }}/2
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-acceptance-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
