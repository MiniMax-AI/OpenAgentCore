name: core-check

on:
  workflow_call:
    inputs:
      ref:
        description: Source commit to check
        required: false
        type: string
      scope:
        description: impact for PRs, full for explicit release verification
        type: string
        default: impact
      native-artifacts:
        description: Retain native installers for a release build
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-check-${{ github.workflow }}-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ${{ vars.OAC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      jobs: ${{ steps.select.outputs.jobs }}
      image: ${{ steps.select.outputs.image }}
      attempt: ${{ steps.select.outputs.attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Select checks from the integrated change
        id: select
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          CHECK_SCOPE: ${{ inputs.scope || 'impact' }}
        run: python3 scripts/ci_plan.py plan

  hygiene:
    needs: plan
    if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'hygiene')
    runs-on: ${{ vars.OAC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Verify names, documentation and CI selection invariants
        run: make check-names check-docs check-ci

  backend:
    needs: plan
    if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'backend')
    uses: ./.github/workflows/ci-backend.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  distribution:
    needs: plan
    if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'distribution')
    uses: ./.github/workflows/ci-distribution.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  harness:
    needs: plan
    if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'harness')
    uses: ./.github/workflows/ci-harness.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  example:
    needs: plan
    if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'example')
    uses: ./.github/workflows/ci-example.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  web:
    needs: plan
    if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'web')
    uses: ./.github/workflows/ci-web.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  web-acceptance:
    needs: [plan, web]
    if: needs.web.result == 'success' && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'web-acceptance')
    uses: ./.github/workflows/ci-web-acceptance.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  api:
    needs: plan
    if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'api')
    uses: ./.github/workflows/api-acceptance.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      container: ${{ needs.plan.outputs.image == 'true' }}

  native:
    needs: plan
    if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'native')
    uses: ./.github/workflows/native.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      upload-artifacts: ${{ inputs.native-artifacts || false }}

  lint:
    needs: plan
    if: needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.jobs || '[]'), 'lint')
    uses: ./.github/workflows/actionlint.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  # Always report the required check, even when planning or a dependency fails.
  check:
    if: always()
    needs: [plan, hygiene, distribution, backend, harness, example, web, web-acceptance, api, native, lint]
    runs-on: ${{ vars.OAC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-22.04' || 'blacksmith-2vcpu-ubuntu-2204' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Require every selected check to succeed
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          PLAN_ATTEMPT: ${{ needs.plan.outputs.attempt }}
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py gate
