name: Node and pnpm store
description: Set up the pinned package manager and cache downloaded packages.
inputs:
  node-version:
    description: Node.js version
    default: '22'
  lockfiles:
    description: Newline-separated lockfile paths consumed by this job
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Install pinned pnpm
      shell: bash
      run: npm install --global pnpm@10.30.3
    - name: Locate pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-10.30.3-${{ hashFiles(inputs.lockfiles) }}
