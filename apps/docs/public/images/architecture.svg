<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">OpenAgentCore API and execution boundaries</title><desc id="desc">Applications call Core with Project API keys. Administrator browsers sign into Web; Web holds the Core key. Nodes and Runtime daemons connect directly to Core using scoped machine credentials. Core owns execution and its PostgreSQL state.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="900" height="420" rx="16" fill="#f8fafc"/>
<g fill="#fff" stroke="#94a3b8" stroke-width="1.5"><rect x="30" y="36" width="200" height="66" rx="10"/><rect x="30" y="161" width="200" height="66" rx="10"/><rect x="303" y="161" width="170" height="66" rx="10"/><rect x="582" y="101" width="190" height="126" rx="10"/><rect x="582" y="311" width="190" height="60" rx="10"/><rect x="30" y="311" width="320" height="60" rx="10"/></g>
<g fill="#0f172a" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle"><text x="130" y="76">Application / SDK</text><text x="130" y="200">Administrator browser</text><text x="388" y="200">Web server</text><text x="677" y="151">Core</text><text x="677" y="179" font-size="14">Execution owner</text><text x="677" y="348">PostgreSQL</text><text x="190" y="348">Node / Runtime / native harness</text></g>
<g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"><path d="M230 69H677V101"/><path d="M230 194H303"/><path d="M473 194H582"/><path d="M677 227V311"/><path d="M350 341H488V227H582"/></g>
<g fill="#334155" font-family="system-ui,sans-serif" font-size="13"><text x="330" y="54">/v1 · Project API key</text><text x="242" y="170">Session</text><text x="476" y="166">/core/v1</text><text x="481" y="184">Core key</text><text x="360" y="286">/api/v1</text><text x="357" y="306">Scoped machine credentials</text></g>
<text x="30" y="400" fill="#475569" font-family="system-ui,sans-serif" font-size="13">Application API and administration API are separate. Machine connections never pass through Web.</text>
</svg>
