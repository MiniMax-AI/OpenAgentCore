<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="Agents Core Web is an open-source console for Parsar Core and compatible Agents API services."
    />
    <title>Agents Core Web</title>
    <script>
      ;(() => {
        const stored = localStorage.getItem("agents-core-web.theme")
        const preference =
          stored === "light" || stored === "dark" || stored === "system" ? stored : "system"
        const resolved =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference
        document.documentElement.dataset.theme = resolved
        document.documentElement.classList.toggle("dark", resolved === "dark")
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
