          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List execution Sessions
      tags:
      - Sessions
    post:
      consumes:
      - application/json
      description: Supports inline configuration or a tenant-owned saved agent_id
        with per-Session field replacements. Execution supports model/instructions,
        text verbosity, non-deferred function tools, adapter-qualified multi_agent
        with persisted Subagent reads, implicit reasoning, service tier auto and environment
        type none, subject to the configured engine. Codex additionally supports HTTP
        MCP with explicit service origin, native allowed_tools and boolean required
        defaulting to false. Session vault_ids attach only project-owned Vaults; credential_id
        selects an attached static bearer credential for the exact HTTPS URL, while
        null/omission selects a unique match or remains anonymous. Ambiguous selection
        rejects creation. Frozen private selections never populate an omitted public
        credential_id; missing decryption configuration fails dispatch without anonymous
        fallback. Required initialization uses native startup before the first native
        Turn, including cold resume, and requires a separately advertised capability;
        exact hosted creation timing and error parity remain unverified. Other MCP
        origins and OAuth remain unsupported. The self_hosted profile requires Codex,
        an absolute workspace_directory and empty capability_directories, with optional
        non-deferred function tools and HTTP MCP using explicit service origin, optionally
        authenticated by the attached Vault rules. Remote MCP and remote Bearer authentication
        each require separately advertised combination support; old peers cannot receive
        unsupported work. Omitted/null capability_directories use the empty-list default;
        self_hosted requires configured execution plus executor registry. Claude SDK
        currently requires medium verbosity and object-root function schemas. It supports
        anonymous or attached static-bearer service-origin HTTP MCP on none with boolean
        required and separately advertised MCP/bearer/required runtime support. Required
        servers must be connected before the first native input is released; pending
        or failed startup rejects execution. The shared Vault selection and immutable
        binding rules apply; unsupported native labels/tool names reject before persistence.
        An attached Vault with no matching credential may remain anonymous; missing
        keys or failed credential lookup/decryption never fall back to anonymous execution.
        Omitted stream defaults to false; stream and agent_id cannot be null. Metadata
        may be null; non-string values and limit violations return invalid_request_error
        with a metadata or metadata.<key> param. Hosted network policy rejections
        return invalid_request_error with a null param. Initial input accepts a string
        or ordered user-message array. Codex and Claude SDK on none and qualified
        openai_hosted also accept inline PNG/JPEG image content; other image combinations
        and remote URLs are unsupported. None initial input atomically starts a Turn;
        self_hosted initial input is reserved while returning its Environment connection
        target, with execution deferred to native readiness and Session failure on
        initial timeout. Initial input is required for none and for streamed creation
        outside self_hosted. Omitted/null input remains valid for non-streaming hosted
        and self_hosted creation. With stream=true, returns live Session events starting
        with the committed creation snapshot and closes right after the first agent.session.idle
        recorded when a Turn ends or an input reservation stops being pending, or
        any agent.session.failed, without sending later events. A creation that admitted
        nothing closes after the snapshot; a settlement that records no event closes
        after events up to the cursor read with a settled Session projection. Required
        actions keep it open; disconnect does not cancel execution. The GET events
        stream remains live-only. New Sessions retain their authenticated creator;
        all creation retries require the same typed subject, including across key
        rotation. Saved-Agent retries and inline requests using Vault attachments
        or credential references retain caller intent independently of later resource
        changes; unrelated inline retries preserve resolved/default equivalences.
        Unknown historical creators reject retries; known creators without recorded
        intent retain resolved-snapshot retry rules. These conflict policies are local
        and not verified hosted parity. A same-key stream=true retry of an existing
        creation returns 201 with no events and closes at once; retry with stream=false
        or use the GET events stream to recover. Claude SDK on none and Core-managed
        Docker openai_hosted supports qualified object-root json_schema output with
        medium verbosity, single-Agent execution and ordinary functions. Hosted execution
        reuses native workspace tools and Files/Artifacts; Skills, Plugins, capability
        directories, HTTP MCP, Subagent and tool_search combinations remain unqualified,
        including inherited template contents. Other non-text initial input remains
        unsupported. Basic Codex and Claude SDK openai_hosted creation requires an
        explicitly configured managed provider. The Claude workspace profile supports
        non-deferred function tools with text or successful inline PNG/JPEG results
        alongside native workspace tools; HTTP MCP remains unsupported. Idle Sessions
        provision automatically; initial provisioning has no caller connection action.
        Network defaults to enabled; disabled and restricted exact ASCII hostnames
        are supported. Restricted policy requires 1–100 allowed domains. Unsupported
        hostname forms and startup installations are rejected. Confidential env, system/npm/Python
        packages and ordered setup commands use the shared initialization lifecycle;
        requested network applies after setup. Initial inline and tenant-owned file_id
        files freeze encrypted bytes before provisioning, then install through the
        common Core lifecycle before native execution or live Files access. With a
        template reference, omitted/null files, env, packages and setup_commands inherit.
        Non-null files and command lists replace; env overlays by key; each package
        manager inherits on omission/null and otherwise replaces its list. Empty lists
        clear their selected field. Tenant-owned environment_template_id references
        inherit omitted/null network and allow only narrowing overrides. Inline hosted
        network:null retains the enabled default; updating a Template with network:null
        resets its saved policy to enabled. Core freezes effective configuration;
        template updates/deletion do not alter Session snapshots or same-intent creation
        retries. Inline or tenant-owned skill_reference Skills share initialization.
        Templates preserve default/latest/explicit selectors; Session creation freezes
        concrete metadata and encrypted content atomically. Skill, Plugin and capability-directory
        list omission/null inherit; a non-null list replaces, including empty-list
        clearing. Omitted/null Skill version selectors resolve the default version.
        Source deletion/default updates cannot change committed Session Skill contents.
        Deferred function discovery uses type-only tool_search and per-function defer_loading
        in the qualified single-agent Claude environment:none function profile, including
        qualified inline image messages and text results. Explicit web_search mode
        disabled and programmatic_tool_calling enabled false use frozen common Runtime
        controls. Enabled forms remain unqualified. Omitted programmatic configuration
        preserves native behavior, a documented difference from the official default-on
        behavior. Other combinations remain unqualified; see the operation coverage.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Creation retry key, up to 128 bytes
        in: header
        name: Idempotency-Key
        type: string
      - description: Session configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateSessionRequest'
      produces:
      - application/json
      - text/event-stream
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
