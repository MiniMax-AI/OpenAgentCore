      - description: Last File ID from the previous page
        in: query
        name: after
        type: string
      - default: 10000
        description: Maximum page size, 1–10000
        in: query
        maximum: 10000
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Creation order; omit for descending, explicit empty values are
          invalid
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Only return Files with this purpose
        in: query
        name: purpose
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SourceFileList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
