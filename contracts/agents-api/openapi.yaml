        Purpose validation precedes cursor lookup; current storage contains only user_data.
        An explicit empty purpose is treated as omitted. Repeated purpose values remain
        rejected. Hosted positive filtering, default order and concurrent-page behavior
        remain unverified. No Beta header is required.
