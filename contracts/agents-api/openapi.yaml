            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List source files
      tags:
      - Files
    post:
      consumes:
      - multipart/form-data
      description: Accepts one multipart file and purpose=user_data in either order,
        with a private 512 MiB content limit and 64 KiB envelope allowance. Commits
        only after the entire request validates. The source is project-owned, independent
        of Sessions and workspace copies. No Beta header is required. Other purposes,
        expires_after, listing, resumable Uploads, quotas/rate-limit and complete
        hosted error/status parity remain unsupported or unverified.
      parameters:
      - description: Source bytes
        in: formData
