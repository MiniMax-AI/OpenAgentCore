        "x-oaiMeta": {
          "examples": {
            "request": {
              "curl": "# 1. Omit reasoning: keep its current settings while renaming the agent.\ncurl \"https://api.openai.com/v1/agents/$AGENT_ID\" \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"OpenAI-Beta: agents=v1\" \\\n  -d '{\"name\": \"Renamed\"}'\n\n# 2. Send null: reset reasoning to the model's defaults.\ncurl \"https://api.openai.com/v1/agents/$AGENT_ID\" \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"OpenAI-Beta: agents=v1\" \\\n  -d '{\"reasoning\": null}'\n\n# 3. Send an object: replace the entire reasoning configuration, without merging.\n# The agent's model must support the \"low\" reasoning effort.\ncurl \"https://api.openai.com/v1/agents/$AGENT_ID\" \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"OpenAI-Beta: agents=v1\" \\\n  -d '{\"reasoning\": {\"effort\": \"low\"}}'\n",
              "python": "from openai import OpenAI\n\nclient = OpenAI()\nagent_id = \"your-agent-id\"\n\n# 1. Omit reasoning: keep its current settings while renaming the agent.\nclient.beta.agents.update(agent_id, name=\"Renamed\")\n\n# 2. Python's None sends JSON null: reset reasoning to the model's defaults.\nclient.beta.agents.update(agent_id, reasoning=None)\n\n# 3. Send an object: replace the entire reasoning configuration, without merging.\n# The agent's model must support the \"low\" reasoning effort.\nclient.beta.agents.update(agent_id, reasoning={\"effort\": \"low\"})\n",
              "javascript": "import OpenAI from \"openai\";\n\nconst client = new OpenAI();\nconst agentId = \"your-agent-id\";\n\n// 1. Omit reasoning: keep its current settings while renaming the agent.\nawait client.beta.agents.update(agentId, { name: \"Renamed\" });\n\n// 2. Send null: reset reasoning to the model's defaults.\nawait client.beta.agents.update(agentId, { reasoning: null });\n\n// 3. Send an object: replace the entire reasoning configuration, without merging.\n// The agent's model must support the \"low\" reasoning effort.\nawait client.beta.agents.update(agentId, { reasoning: { effort: \"low\" } });\n",
              "go": "package main\n\nimport (\n    \"context\"\n    \"log\"\n\n    \"github.com/openai/openai-go/v3\"\n    \"github.com/openai/openai-go/v3/packages/param\"\n)\n\nfunc main() {\n    client := openai.NewClient()\n    ctx := context.Background()\n    agentID := \"your-agent-id\"\n\n    // 1. Omit reasoning: keep its current settings while renaming the agent.\n    _, err := client.Beta.Agents.Update(ctx, agentID, openai.BetaAgentUpdateParams{\n        Name: openai.String(\"Renamed\"),\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n\n    // 2. Send null: reset reasoning to the model's defaults.\n    _, err = client.Beta.Agents.Update(ctx, agentID, openai.BetaAgentUpdateParams{\n        Reasoning: param.NullStruct[openai.AgentReasoningParam](),\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n\n    // 3. Send an object: replace the entire reasoning configuration, without merging.\n    // The agent's model must support the \"low\" reasoning effort.\n    _, err = client.Beta.Agents.Update(ctx, agentID, openai.BetaAgentUpdateParams{\n        Reasoning: openai.AgentReasoningParam{Effort: openai.AgentReasoningParamEffortLow},\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n}\n",
              "java": "import com.openai.client.OpenAIClient;\nimport com.openai.client.okhttp.OpenAIOkHttpClient;\nimport com.openai.core.JsonValue;\nimport com.openai.models.beta.agents.AgentReasoningParam;\nimport com.openai.models.beta.agents.AgentUpdateParams;\n\npublic class AgentUpdateExample {\n    public static void main(String[] args) {\n        OpenAIClient client = OpenAIOkHttpClient.fromEnv();\n        String agentId = \"your-agent-id\";\n\n        // 1. Omit reasoning: keep its current settings while renaming the agent.\n        client.beta().agents().update(AgentUpdateParams.builder()\n            .agentId(agentId)\n            .name(\"Renamed\")\n            .build());\n\n        // 2. Send null: reset reasoning to the model's defaults.\n        client.beta().agents().update(AgentUpdateParams.builder()\n            .agentId(agentId)\n            .reasoning(JsonValue.from(null))\n            .build());\n\n        // 3. Send an object: replace the entire reasoning configuration, without merging.\n        // The agent's model must support the \"low\" reasoning effort.\n        client.beta().agents().update(AgentUpdateParams.builder()\n            .agentId(agentId)\n            .reasoning(AgentReasoningParam.builder()\n                .effort(AgentReasoningParam.Effort.LOW)\n                .build())\n            .build());\n    }\n}\n",
              "ruby": "require \"openai\"\n\nclient = OpenAI::Client.new\nagent_id = \"your-agent-id\"\n\n# 1. Omit reasoning: keep its current settings while renaming the agent.\nclient.beta.agents.update(agent_id, name: \"Renamed\")\n\n# 2. Ruby's nil sends JSON null: reset reasoning to the model's defaults.\nclient.beta.agents.update(agent_id, reasoning: nil)\n\n# 3. Send an object: replace the entire reasoning configuration, without merging.\n# The agent's model must support the \"low\" reasoning effort.\nclient.beta.agents.update(agent_id, reasoning: {effort: :low})\n"
            }
          }
        }
