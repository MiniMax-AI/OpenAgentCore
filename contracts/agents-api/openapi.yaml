info:
  contact: {}
  description: Supported single-Agent execution resources from the pinned openai-python
    beta/agents contract. Bearer keys bind an execution principal to one project;
    optional OpenAI-Organization and OpenAI-Project headers must match that binding.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Agents API
  version: "1"
paths:
  /agents:
    get:
      description: Lists only the authenticated tenant's saved Agents, independently
        of Sessions. Limit 0 is treated as 1 and larger limits as 100, as observed
        on the hosted service. The local default is 20; exact upstream default/cap
        and empty cursor fields remain unverified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Last Agent ID from the previous page
        in: query
        name: after
        type: string
      - default: 20
        description: Page size; 0 is treated as 1 and values above 100 as 100
        in: query
        minimum: 0
        name: limit
        type: integer
      - default: desc
        description: Creation order; omit for descending, explicit empty values are
          invalid
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SavedAgentList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List reusable Agents
      tags:
      - Agents
    post:
      consumes:
      - application/json
      description: 'Persists configuration independently of execution. Names over
        128 characters and metadata outside 16 string pairs with 64-character keys
        and 512-character values return invalid_request_error with the official param;
        U+0000 in stored strings is rejected as a local storage limit. Supports model/name/instructions/metadata,
        explicit reasoning and service tiers, multi_agent, text/json_schema, function/tool_search/programmatic_tool_calling
        and HTTP MCP with nullable credential_id and explicit service origin and boolean
        required defaulting to false. Saving credential_id grants no access: Session
        admission checks attached Vault ownership and destination. MCP allowed_tools
        preserves null versus empty; saved HTTP transport includes empty headers.
        Model-derived reasoning defaults, other MCP variants, enabled web_search and
        public retry conformance remain incomplete. Explicit disabled web_search can
        be saved; Session execution also accepts explicit disabled programmatic_tool_calling
        through qualified Runtime controls. Session execution admits only its supported
        configuration subset.'
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Reusable Agent configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.SavedAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a reusable Agent
      tags:
      - Agents
  /agents/{agent_id}:
    delete:
      description: Deletes only the authenticated tenant's saved configuration. Existing
        Session snapshots, history and recorded creation retry identities remain independent.
        Missing and repeated deletion locally return404; exact hosted error and in-flight
        creation/deletion semantics remain unverified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AgentDeleted'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a reusable Agent
      tags:
      - Agents
    get:
      description: Reads the saved resource owned by the authenticated tenant, independently
        of execution Sessions.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SavedAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve a reusable Agent
      tags:
      - Agents
    post:
      consumes:
      - application/json
      description: Preserves omitted fields and replaces supplied fields using shared
        saved-configuration validation. Null name/instructions clear; null or empty
        metadata clears all pairs. Name and metadata validation errors return invalid_request_error
        with the official param. Existing Session snapshots are unchanged. Empty updates
        advance updated_at without changing saved fields. Nested replacement/null
        defaults, model-derived reasoning and exact hosted error behavior remain incompletely
        verified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Supplied reusable Agent fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SavedAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a reusable Agent
      tags:
      - Agents
  /agents/core/startup-configuration:
    get:
      description: Returns a secret-free snapshot of supported build capabilities
        and validated process startup selections. It does not inspect or aggregate
        daemon heartbeats, Sessions, Environments or Runtime state, and does not prove
        model-provider reachability, credentials, native readiness, sandbox isolation
        or successful execution.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.CoreStartupConfiguration'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve safe Core startup configuration
      tags:
      - Core extensions
  /agents/environments/{environment_id}:
    get:
      description: Returns durable connection status and safe installed metadata for
        supported self_hosted and basic openai_hosted profiles. Initial files expose
        frozen safe metadata without content; Plugin/Skill entries expose only safe
        configured installation metadata. Capability-directory discoveries are not
        added to those arrays. Unsupported installation configurations remain implementation
        gaps. This read does not prepare execution, start compute or require an enabled
        execution worker. Session deletion removes the associated Environment from
        public reads; project-shared read authorization is unchanged. Connection status
        does not prove native readiness or process quiescence.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Environment ID
        in: path
        name: environment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.EnvironmentInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Retrieve an execution Environment
      tags:
      - Environments
  /agents/environments/{environment_id}/files:
    get:
      description: Lists direct regular files in one authorized self_hosted or qualified
        local workspace directory. Local paths use the public /workspace root and
        must be in cleaned form. This partial implementation defaults to the workspace
        root and limit 20; recursive scope and these defaults are not verified upstream
        semantics. A missing path, a regular file or a symbolic link returns an empty
        page; links are never followed. Daemons without a local workspace binding
        use the Claude SDK adapter reader, which keeps 404 for a missing path and
        503 for a regular file or symbolic link. Well-formed unknown query keys are
        ignored; malformed query encoding and a repeated supported key are rejected.
        Sorts by case-sensitive path components, descending by default. Keep the same
        path, order and limit when using page. Each page rereads the complete bounded
        directory; changed file paths/sizes invalidate continuation locally with 400.
        There is no snapshot guarantee. An openai_hosted Environment that has not
        connected yet returns 400. Truncated or uncertain native results fail with
        503 without returning a partial page. This read never starts a Turn or admits
        model input. Actual transport disconnect/reconnect events remain observable.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Environment ID
        in: path
        name: environment_id
        required: true
        type: string
      - description: Absolute directory in cleaned form inside /workspace
        in: query
        name: path
        type: string
      - description: Maximum file count; local default 20
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Case-sensitive path-component order; omit for descending, explicit
          empty values are invalid
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Opaque continuation token; keep path, order and limit unchanged
        in: query
        name: page
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.EnvironmentFileList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List live Environment files
      tags:
      - Environments
    post:
      consumes:
      - application/json
      description: Uploads standard Base64 bytes to a file beneath /workspace in a
        qualified local Environment and returns 201. Accepts inline bytes or a project-owned
        source file_id through the same write path. Unknown body fields are rejected
        with their name as param. Basic public hosted creation requires explicit managed
        Runtime configuration; an openai_hosted Environment that has not connected
        yet returns 400. A private 50 MiB decoded-content limit applies. The parent
        directory must exist. Replacement installs a new mode-0600 inode; upstream
        overwrite metadata semantics remain unverified. Idle writes exclude execution.
        Missing receipts return unavailable and retain a durable mutation gate without
        automatic replay. Error/timing parity with upstream remains unverified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Environment ID
        in: path
        name: environment_id
        required: true
        type: string
      - description: Inline bytes or source file ID and absolute workspace path
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.EnvironmentFileCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.EnvironmentFile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an Environment file from inline bytes or a source file
      tags:
      - Environments
  /agents/environments/templates:
    get:
      description: Lists tenant-owned safe template metadata in creation order with
        ID tie-breaking. Defaults to limit 20 and descending order; limit 0 is treated
        as 1 and larger limits as 100. Foreign and missing cursors reject identically.
        Concurrent-page and exact hosted error behavior remain unverified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Previous Template ID
        in: query
        name: after
        type: string
      - default: 20
        description: Page size; 0 is treated as 1 and values above 100 as 100
        in: query
        minimum: 0
        name: limit
        type: integer
      - default: desc
        description: Creation order; omit for descending, explicit empty values are
          invalid
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.EnvironmentTemplateList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Environment Templates
      tags:
      - Environment Templates
    post:
      consumes:
      - application/json
      description: Saves tenant-owned hosted configuration. Supports nullable name,
        enabled/disabled or exact-domain restricted network, initial inline/file_id
        files, confidential env, ordered setup_commands, system/npm/Python packages
        inline/referenced Skill ZIPs, Plugin ZIPs and workspace-contained capability
        directories. Omitted/null network defaults to enabled. Restricted network
        requires 1–100 exact ASCII hostnames; other host forms and populated unsupported
        installations are rejected before persistence without echoing input. Network
        policy rejections return invalid_request_error with a null param. No compute
        is allocated. Exact hosted error/retry semantics remain unverified.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Reusable configuration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.EnvironmentTemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.EnvironmentTemplate'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an Environment Template
      tags:
      - Environment Templates
  /agents/environments/templates/{environment_template_id}:
    delete:
      description: Deletes the tenant-owned reusable configuration without changing
        or deleting existing Sessions and their frozen configuration.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
