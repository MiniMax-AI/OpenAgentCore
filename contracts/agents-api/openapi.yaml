        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SessionEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream live Session events
      tags:
      - Events
    post:
      consumes:
      - application/json
      description: An empty events array is a resource-authorized no-op; it creates
        no execution retry identity, Turn, Item or input receipt. For environment
        none, atomically accepts text messages, cancellation and function results.
        Messages steer active work or start a queued Turn. The supported self_hosted
        profile accepts text-only messages; qualified Codex and Claude SDK openai_hosted
        profiles also accept inline PNG/JPEG. Under the Session lock, matching retries
        retain their original target; new active messages append to the current Turn,
        while idle messages reserve work and wait up to the original five-minute connection/admission
        deadline. Return 202 only after durable admission, without claiming native
        application; active messages create no Turn or reservation. Cancellation-only
        prepared-environment batches use existing durable cancellation admission and
        return 202 without waiting for native exit; a new cancellation conflicts while
        a pre-Turn reservation is pending. Homogeneous tool_result-only prepared-environment
        batches reuse existing scoped result admission and application receipts without
        creating a Turn or bypassing a pending reservation. Mixed prepared-environment
        batches remain unsupported. HTTP expiry/cancellation use local 409 environment_input_expired/environment_input_cancelled
        errors; exact hosted failure mapping is unverified. Losing execution ownership
        returns 503. The response write deadline accommodates the admission window
        for either prepared Environment, independently of new-hosted-admission and
        executor URL settings. Disconnecting the waiting HTTP request does not cancel
        retained work or restart its deadline. Retry keys identify the whole ordered
        batch. Function output accepts text or ordered text/image parts subject to
        engine support; Claude SDK accepts text results and, on none and qualified
        openai_hosted, successful inline PNG/JPEG results, preserving ordered content;
        error images and remote references reject before admission. Native image resizing
        may change bytes. Runtime image-result support is checked only for image-bearing
        delivery. Codex and Claude SDK on none and qualified openai_hosted accept
        ordered inline PNG/JPEG image messages. Self-hosted profiles and other engines
        remain text-only; remote image URLs are unsupported. Image references are
        retained unchanged without service-side downloads.
      parameters:
      - description: agents=v1
        in: header
        name: OpenAI-Beta
        required: true
        type: string
      - description: Retry key, up to 128 bytes
        in: header
        name: Idempotency-Key
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Ordered input events
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateEventsRequest'
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit Session input events
      tags:
      - Sessions
