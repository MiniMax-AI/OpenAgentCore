info:
  contact: {}
  description: Core extensions outside the upstream Agents API. Environment executor credential operations use project caller authentication. Sandbox administration and node enrollment use separate administrator and node credentials. See each operation's security requirements.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Core Extensions
  version: "1"
paths:
  /core/v1/environments/{environment_id}/executor-credentials:
    post:
      consumes:
        - application/json
      description: Core extension, not an upstream Agents API operation. Uses the project caller key and exact live self_hosted Session creator. Returns a connect-only secret once, restricted to this Environment. Repeating an issuance key_id returns 409; after an uncertain response explicitly rotate that same key_id. Rotation retains immutable ownership and invalidates the old secret. No Session API authority is granted.
      parameters:
        - description: Environment UUID
          in: path
          name: environment_id
          required: true
          type: string
        - description: Request
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/api.EnvironmentExecutorCredentialRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.IssuedExecutorCredential'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Issue or explicitly rotate an Environment executor credential
      tags:
        - Environment Executor
  /core/v1/environments/{environment_id}/executor-credentials/{key_id}:
    delete:
      description: Core extension authenticated by the project caller key. Revokes only the caller's exact Environment-restricted credential. Repeated revocation is safe. Revocation denies future enrollment and dispatch but does not stop caller-owned compute or prove process quiescence.
      parameters:
        - description: Environment UUID
          in: path
          name: environment_id
          required: true
          type: string
        - description: Executor key UUID
          in: path
          name: key_id
          required: true
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - BearerAuth: []
      summary: Revoke an Environment executor credential
      tags:
        - Environment Executor
  /core/v1/project-api-keys/{binding_digest}:
    get:
      description: Core extension requiring deployment administrator authority. The binding digest selects only a statically configured caller; it does not authenticate. Returns safe metadata, never key secrets or token digests. Derived keys freeze that caller's principal and stop authenticating when the static parent is removed or rebound.
      parameters:
        - description: Configured caller SHA-256 binding selector
          in: path
          name: binding_digest
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ProjectAPIKeyList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: List project API keys for a configured caller binding
      tags:
        - Project API Keys
    post:
      consumes:
        - application/json
      description: Core extension requiring deployment administrator authority. Generates an independent random secret, stores only its digest and returns the secret once. A duplicate request ID returns 409 without replaying the secret. After an uncertain response, list the ID and revoke it explicitly before creating another key. The key inherits the frozen static caller principal and cannot manage keys or deployment resources.
      parameters:
        - description: Configured caller SHA-256 binding selector
          in: path
          name: binding_digest
          required: true
          type: string
        - description: Key ID and display name
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/api.ProjectAPIKeyRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.IssuedProjectAPIKey'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Create a project API key for a configured caller binding
      tags:
        - Project API Keys
  /core/v1/project-api-keys/{binding_digest}/{key_id}:
    delete:
      description: Core extension requiring deployment administrator authority. Scopes the key ID to the exact configured parent binding and principal. Revocation prevents future authenticated requests; it does not cancel already admitted operations or streams. Missing and foreign IDs return the same 404 response.
      parameters:
        - description: Configured caller SHA-256 binding selector
          in: path
          name: binding_digest
          required: true
          type: string
        - description: Project API key UUID
          in: path
          name: key_id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SandboxMutationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Revoke a project API key
      tags:
        - Project API Keys
  /core/v1/resource-owners:
    get:
      description: Deployment administrator only. A configured binding selects the project. Returns null for resources without recorded creation provenance, including historical and foreign resources. No key secret is returned.
      parameters:
        - description: Configured caller SHA-256 binding selector
          in: query
          name: binding_digest
          required: true
          type: string
        - description: Resource type
          in: query
          name: resource_type
          required: true
          type: string
        - description: Comma-separated public resource IDs, maximum 100
          in: query
          name: resource_ids
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ResourceOwnerList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Batch lookup resource creation keys
      tags:
        - Write Audit
  /core/v1/sandbox/deployment:
    get:
      description: Core deployment extension. Does not grant project resource access. Responses contain only explicit safe fields.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.RuntimeDeploymentView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Retrieve sandbox deployment
      tags:
        - Sandbox Manager
    post:
      consumes:
        - application/json
      description: Selects a provider and public Core origin. E2B credentials are write-only. Exact retries return the existing selection; differing selections and file-managed deployments reject. This does not create compute or execute work.
      parameters:
        - description: Deployment selection
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/api.SandboxDeploymentInput'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.RuntimeDeploymentView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Initialize the deployment sandbox provider
      tags:
        - Sandbox Manager
    put:
      consumes:
        - application/json
      description: Requires maintenance, the current generation and verified cleanup of all old resources. Credentials are write-only. The public Core origin stays unchanged. Historical records are retained; old node credentials and enrollments are retired. Explicitly resume after success. Never automatically retry an uncertain write.
      parameters:
        - description: Replacement deployment selection
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/api.SandboxDeploymentChangeInput'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.RuntimeDeploymentView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Change a fully drained deployment's sandbox provider
      tags:
        - Sandbox Manager
  /core/v1/sandbox/deployment/maintenance:
    patch:
      consumes:
        - application/json
      description: Requires the current generation. Maintenance preserves execution, cleanup and history. Resume requires successfully activated provider configuration.
      parameters:
        - description: Maintenance state
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/store.SandboxMaintenanceRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.RuntimeDeploymentView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Pause or resume new hosted allocations
      tags:
        - Sandbox Manager
  /core/v1/sandbox/enroll:
    post:
      consumes:
        - application/json
      description: Core deployment extension. Does not grant project resource access. Responses contain only explicit safe fields.
      parameters:
