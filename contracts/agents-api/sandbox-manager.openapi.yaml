  /core/v1/admin/summary:
    get:
      description: Administrator only. after/limit/order paginate Projects. Agent grouping returns groups within those spaces. Date bounds filter Session creation, not current asset counts. Usage sums only non-null public Session usage; coverage includes every selected Session. Each Project is read in a consistent database snapshot. Totals are not billing records.
      parameters:
        - description: One API Project
          in: query
          name: project_id
          type: string
        - default: project
          description: Grouping
          enum:
            - project
            - agent
            - key
          in: query
          name: group_by
          type: string
        - description: Inclusive RFC3339 Session creation time
          in: query
          name: created_after
          type: string
        - description: Exclusive RFC3339 Session creation time
          in: query
          name: created_before
          type: string
        - description: Last Project ID in preceding page
          in: query
          name: after
          type: string
        - default: 20
          description: Number of Projects
          in: query
          maximum: 100
          minimum: 1
          name: limit
          type: integer
        - default: desc
          description: Project order
          enum:
            - asc
            - desc
          in: query
          name: order
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
