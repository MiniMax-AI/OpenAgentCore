info:
  contact: {}
  description: Core extensions outside the upstream Agents API. Environment executor credential operations use project caller authentication. Sandbox administration and node enrollment use separate administrator and node credentials. See each operation's security requirements.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Core Extensions
  version: "1"
paths:
  /core/v1/admin/audit-log:
    get:
      description: Deployment administrator only. Newest-first cursor pagination of safe metadata. Actor labels are unverified console labels, not authorization identities. Request bodies and secrets are never recorded.
      parameters:
        - description: Target Project ID
          in: query
          name: project_id
          type: string
        - description: Resource type
          in: query
          name: resource_type
          type: string
        - description: Resource ID
          in: query
          name: resource_id
          type: string
        - description: Mutation action
          in: query
          name: action
          type: string
        - description: Inclusive RFC3339 timestamp
          in: query
          name: created_after
          type: string
        - description: Exclusive RFC3339 timestamp
          in: query
          name: created_before
          type: string
        - default: 50
          description: Page size
          in: query
          maximum: 100
          minimum: 1
          name: limit
          type: integer
        - description: Opaque next_cursor from the preceding page
          in: query
          name: after
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.AdminAuditPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Query committed administrator mutations
      tags:
        - Core Administration
  /core/v1/admin/copies:
    post:
      consumes:
        - application/json
      description: Deployment administrator only. Copies content and allowed secrets inside one transaction, rewrites selected dependencies and records administrator provenance. Refreshable OAuth credentials are skipped. Sessions and Artifacts cannot be copied. Reusing an Idempotency-Key with changed input returns conflict.
      parameters:
        - description: Copy retry identity, up to 128 characters
          in: header
          name: Idempotency-Key
          type: string
        - description: Source and target Projects and resource
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/api.AdminCopyRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.CopyAssetsResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Copy assets into another Project
      tags:
        - Core Administration
  /core/v1/admin/core-metrics:
    get:
      description: Deployment administrator only. Complete UTC buckets; unknown measurements are null. Samples are process-local and are not backfilled after a restart.
      parameters:
        - description: Time range (default 1h)
          enum:
            - 1h
            - 6h
            - 24h
            - 7d
          in: query
          name: range
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/coremetrics.View'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Retrieve Core operational metrics
      tags:
        - Core Administration
  /core/v1/admin/projects:
    get:
      parameters:
        - description: Project ID cursor
          in: query
          name: after
          type: string
        - description: Page size (1-100)
          in: query
          name: limit
          type: integer
        - description: asc or desc by Project ID
          in: query
          name: order
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ProjectPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: List Projects and active key counts
      tags:
        - Administrator Projects
    post:
      consumes:
        - application/json
      parameters:
        - description: Project display name
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/api.ProjectRequest'
      produces:
        - application/json
      responses:
