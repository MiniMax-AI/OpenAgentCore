info:
  contact: {}
  description: Deployment and operations routes under /core/v1 for Core Web's server and operator scripts. Every operation requires the Core key; Project API keys and machine credentials are not accepted.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Core API
  version: "1"
paths:
  /core/v1/audit-log:
    get:
      description: Core key only. Newest-first cursor pagination of safe metadata. Actor labels are unverified console labels, not authorization identities. Request bodies and secrets are never recorded.
      parameters:
        - description: Target Project ID
          in: query
          name: project_id
          type: string
        - description: Resource type
          in: query
          name: resource_type
          type: string
        - description: Resource ID
          in: query
          name: resource_id
          type: string
        - description: Mutation action
          in: query
          name: action
          type: string
        - description: Inclusive RFC3339 timestamp
          in: query
          name: created_after
          type: string
        - description: Exclusive RFC3339 timestamp
          in: query
          name: created_before
          type: string
        - default: 50
          description: Page size
          in: query
          maximum: 100
          minimum: 1
          name: limit
          type: integer
        - description: Opaque next_cursor from the preceding page
          in: query
          name: after
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.AdminAuditPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Query committed administrator mutations
      tags:
        - Core Administration
  /core/v1/harnesses:
    get:
      description: Core key only. Returns every harness this build supports, in name order. enabled and default are read-only views of the process configuration (AGENTS_API_ENGINE and AGENTS_API_HARNESSES). model_provider is the harness's deployment default, stored in Core, or null. Keys are never returned; api_key_configured reports that one is set.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CoreHarnessList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: List harnesses and their deployment default model providers
      tags:
        - Deployment Model Providers
  /core/v1/harnesses/{harness}/model-provider:
    delete:
      description: Core key only. Idempotent; each successful request is audited. Sessions that already froze the default keep it. Afterwards new openai_hosted Sessions for this harness need a Session or Agent bundle.
      parameters:
        - description: Harness
          enum:
            - claude_sdk
            - codex
            - mcode
          in: path
          name: harness
          required: true
          type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Remove a harness's deployment default model provider
      tags:
        - Deployment Model Providers
    get:
      description: Core key only. Returns the safe view; the key is never returned. 404 when the harness does not exist or has no deployment default.
      parameters:
        - description: Harness
          enum:
            - claude_sdk
            - codex
            - mcode
          in: path
          name: harness
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HarnessModelProvider'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Retrieve a harness's deployment default model provider
      tags:
        - Deployment Model Providers
    put:
      consumes:
        - application/json
      description: 'Core key only. The body is the complete x_agents_core.model_provider bundle, including the write-only api_key; there is no partial update and bundles are never merged. The provider is validated for this harness: an HTTPS base_url without credentials, query or fragment, the harness''s protocol (responses for codex, anthropic for claude_sdk and mcode) and, for mcode, positive context_window and max_output_tokens. New openai_hosted and none Sessions that resolve no Session or Agent bundle freeze this default into their encrypted snapshot; existing Sessions never change. self_hosted Sessions never use it. The key is encrypted and never returned. Each write records an administrator audit entry without the key.'
      parameters:
        - description: Harness
          enum:
            - claude_sdk
            - codex
            - mcode
          in: path
          name: harness
          required: true
          type: string
        - description: Complete model provider bundle
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/v1.ModelProviderInput'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HarnessModelProvider'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Replace a harness's deployment default model provider
      tags:
        - Deployment Model Providers
  /core/v1/installation:
    get:
      description: Core key only; available before any sandbox deployment exists. Reports the public URL that applications, nodes, sandboxes and self-hosted executors use, the API base URL, Core's source commit and installation ID, the installer's settings snapshot with where to change it, and what is bound to the current public URL. Sensitive settings report only whether they are configured.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Installation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Retrieve installation facts and process settings
      tags:
        - Core Administration
  /core/v1/metrics:
    get:
      description: Core key only. Complete UTC buckets; unknown measurements are null. Samples are process-local and are not backfilled after a restart.
      parameters:
        - description: Time range (default 1h)
          enum:
            - 1h
            - 6h
            - 24h
            - 7d
          in: query
          name: range
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/coremetrics.View'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: Retrieve Core operational metrics
      tags:
        - Core Administration
  /core/v1/projects:
    get:
      parameters:
        - description: Project ID cursor
          in: query
          name: after
          type: string
        - description: Page size (1-100)
          in: query
          name: limit
          type: integer
        - description: asc or desc by Project ID
          in: query
          name: order
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.ProjectPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      security:
        - DeploymentAdminAuth: []
      summary: List Projects and active key counts
      tags:
        - Administrator Projects
    post:
      consumes:
        - application/json
      parameters:
        - description: Project display name
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/api.ProjectRequest'
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/store.Project'
        "400":
          description: Bad Request
          schema:
