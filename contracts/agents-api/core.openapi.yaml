basePath: /
definitions:
  api.AdminRuntimeObservation:
    properties:
      observation:
        $ref: '#/definitions/api.AdminRuntimeObservationDetail'
      project_id:
        type: string
    type: object
  api.AdminRuntimeObservationDetail:
    properties:
      allocation_created_at:
        minimum: 0
        type: integer
        x-nullable: true
      cpu:
        allOf:
          - $ref: '#/definitions/v1.RuntimeCPUObservation'
        x-nullable: true
      disk:
        allOf:
          - $ref: '#/definitions/api.RuntimeDiskObservation'
        description: |-
          Current Runtime disk usage and capacity. E2B reports them; Docker and
          microsandbox observations return null.
        x-nullable: true
      environment_id:
        format: uuid
        type: string
        x-nullable: true
      id:
        format: uuid
        type: string
      instance:
        $ref: '#/definitions/v1.RuntimeInstance'
      lifecycle_state:
        enum:
          - active
          - sleeping
          - transitioning
          - pending
          - stopped
        type: string
        x-nullable: true
      memory:
        allOf:
          - $ref: '#/definitions/v1.RuntimeMemoryObservation'
        x-nullable: true
      mode:
        enum:
          - none
          - self_hosted
          - openai_hosted
        type: string
      object:
        enum:
          - agent.runtime_observation
        type: string
      observed_at:
        minimum: 0
        type: integer
        x-nullable: true
      provider_type:
        type: string
        x-nullable: true
      reason:
        enum:
          - runtime_mode_not_observable
          - allocation_pending
          - runtime_not_running
          - source_not_configured
          - sample_timeout
          - sample_unavailable
        type: string
        x-nullable: true
      resolved_at:
        minimum: 0
        type: integer
      session_id:
        format: uuid
        type: string
      started_at:
        minimum: 0
        type: integer
        x-nullable: true
      status:
        enum:
          - observed
          - unsupported
          - unavailable
        type: string
    required:
      - allocation_created_at
      - cpu
      - disk
      - environment_id
      - id
      - instance
      - lifecycle_state
      - memory
      - mode
      - object
      - observed_at
      - provider_type
      - reason
      - resolved_at
      - session_id
      - started_at
      - status
    type: object
  api.AdminRuntimeObservationList:
    properties:
      data:
        items:
          $ref: '#/definitions/api.AdminRuntimeObservation'
        type: array
      first_id:
        type: string
      has_more:
        type: boolean
      last_id:
        type: string
      object:
        type: string
    type: object
  api.AdminSessionArchiveRequest:
    properties:
      expected_generation:
        type: integer
    type: object
  api.AdminSessionCounts:
    properties:
      failed:
        type: integer
      idle:
        type: integer
      in_progress:
        type: integer
      requires_action:
        type: integer
      total:
        type: integer
    type: object
  api.AdminSummaryResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/api.AdminSummaryRow'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  api.AdminSummaryRow:
    properties:
      agent_id:
        type: string
      assets:
        $ref: '#/definitions/store.AdminAssetCounts'
      coverage:
        $ref: '#/definitions/api.AdminUsageCoverage'
      key_id:
        type: string
      last_active_at:
        type: integer
      project_id:
        type: string
      sessions:
        $ref: '#/definitions/api.AdminSessionCounts'
      usage:
        $ref: '#/definitions/v1.TokenUsage'
    type: object
  api.AdminUsageCoverage:
    properties:
      measured_sessions:
        type: integer
      ratio:
        type: number
      total_sessions:
        type: integer
    type: object
  api.CoreHarness:
    properties:
      default:
        type: boolean
      enabled:
        type: boolean
      id:
        enum:
          - claude_sdk
          - codex
          - mcode
        type: string
      model_provider:
        allOf:
          - $ref: '#/definitions/api.HarnessModelProvider'
        x-nullable: true
      object:
        enum:
          - core.harness
        type: string
    required:
      - default
      - enabled
      - id
      - model_provider
      - object
    type: object
  api.CoreHarnessList:
    properties:
      data:
        items:
          $ref: '#/definitions/api.CoreHarness'
        type: array
      object:
        enum:
          - list
        type: string
    required:
      - data
      - object
    type: object
  api.EnvironmentExecutorCredentialRequest:
    properties:
      key_id:
        format: uuid
        type: string
      rotate:
        type: boolean
    type: object
  api.ExecutorCredentialList:
    properties:
      data:
        items:
          $ref: '#/definitions/store.ExecutorCredential'
        type: array
    type: object
  api.HarnessModelProvider:
    properties:
      api_key_configured:
        type: boolean
      base_url:
        type: string
      context_window:
        type: integer
      harness:
        enum:
          - claude_sdk
          - codex
          - mcode
        type: string
      max_output_tokens:
        type: integer
      object:
        enum:
          - core.model_provider
        type: string
      protocol:
        enum:
          - anthropic
          - responses
        type: string
      updated_at:
        type: string
    required:
      - api_key_configured
      - base_url
      - harness
      - object
      - protocol
      - updated_at
    type: object
  api.Installation:
    properties:
      address_bindings:
        $ref: '#/definitions/store.AddressBindings'
      api_base_url:
        description: public_url followed by /v1; null when public_url is null.
        type: string
        x-nullable: true
      configuration:
        allOf:
          - $ref: '#/definitions/api.InstallationConfiguration'
        description: The installer's settings snapshot (AGENTS_API_SETTINGS_FILE); null when the installer did not start Core.
        x-nullable: true
      installation_id:
        description: AGENTS_API_SANDBOX_INSTALLATION_ID; null when Core runs without the sandbox manager.
        type: string
        x-nullable: true
      local_only:
        description: True when public_url names a loopback host, reachable only from the Core host.
        type: boolean
      object:
        enum:
          - core.installation
        type: string
      public_url:
        description: 'AGENTS_API_PUBLIC_URL: the origin applications, nodes, sandboxes and self-hosted executors use. Null when unset.'
        type: string
        x-nullable: true
      source_commit:
        description: Full source commit Core was built from; null for development builds.
        type: string
        x-nullable: true
    type: object
  api.InstallationConfiguration:
    properties:
      applied_at:
        type: string
      apply_command:
        description: Command that applies config.json changes.
        type: string
      path:
        description: Absolute host path of the installation's config.json.
        type: string
      settings:
        items:
          $ref: '#/definitions/api.InstallationSetting'
        type: array
    type: object
  api.InstallationSetting:
    properties:
      changeable:
        description: False for settings fixed at installation.
        type: boolean
      configured:
        description: 'Present only for a sensitive setting: whether it has a value.'
        type: boolean
      default:
        x-nullable: true
      key:
        description: Dotted config.json key, such as ports.core.
        type: string
      restarts:
        description: Services that restart when the setting changes.
        items:
          type: string
        type: array
      sensitive:
        type: boolean
      value:
        description: Applied value; always null for a sensitive setting.
        x-nullable: true
    type: object
  api.ProjectAPIKeyRequest:
    properties:
      name:
        type: string
    type: object
  api.ProjectRequest:
    properties:
      name:
        type: string
    type: object
  api.ResourceOwnerList:
    properties:
      data:
        items:
          $ref: '#/definitions/store.ResourceOwner'
        type: array
    type: object
  api.RuntimeDiskObservation:
    properties:
      limit_bytes:
        minimum: 1
        type: integer
        x-nullable: true
      usage_bytes:
        minimum: 0
        type: integer
        x-nullable: true
    required:
      - limit_bytes
      - usage_bytes
    type: object
  api.SandboxAllocationList:
    properties:
      data:
        items:
          $ref: '#/definitions/store.RuntimeNodeAllocation'
        type: array
    type: object
  api.SandboxDeploymentChangeInput:
    properties:
      e2b:
        $ref: '#/definitions/api.SandboxE2BInput'
      expected_generation:
        type: integer
      provider:
        type: string
      resources:
        allOf:
          - $ref: '#/definitions/sandbox.Resources'
        description: |-
          Per-sandbox limits, required for Docker and microsandbox. E2B may omit
          them; Core then uses the validated template build's cpus and memory_mib.
      runtime:
        $ref: '#/definitions/sandbox.RuntimeRelease'
    type: object
  api.SandboxDeploymentInput:
    properties:
      e2b:
        $ref: '#/definitions/api.SandboxE2BInput'
      provider:
        type: string
      resources:
        allOf:
          - $ref: '#/definitions/sandbox.Resources'
        description: |-
          Per-sandbox limits, required for Docker and microsandbox. E2B may omit
          them; Core then uses the validated template build's cpus and memory_mib.
      runtime:
        $ref: '#/definitions/sandbox.RuntimeRelease'
    type: object
  api.SandboxE2BInput:
    properties:
      api_key:
        type: string
      template:
        type: string
    type: object
  api.SandboxEnrollmentToken:
    properties:
      enrollment_id:
        description: Public, non-secret handle of this command; never a credential. The node it registers reports the same value as enrollment_id.
        type: string
      expires_at:
        type: string
      token:
        type: string
    type: object
  api.SandboxEnrollmentTokenRequest:
    properties:
      max_active:
        type: integer
      max_retained:
        description: Docker never suspends, so Core replaces this with max_active; microsandbox uses both limits.
        type: integer
    type: object
  api.SandboxMutationResponse:
    properties:
      deleted:
        type: boolean
      id:
        type: string
      updated:
        type: boolean
    type: object
  api.SandboxNodeList:
    properties:
      data:
        items:
          $ref: '#/definitions/store.RuntimeNode'
        type: array
    type: object
  coremetrics.Database:
    properties:
      ping_ms:
        $ref: '#/definitions/coremetrics.Latency'
      pool:
        $ref: '#/definitions/coremetrics.Pool'
      series:
        items:
          $ref: '#/definitions/coremetrics.DatabaseBucket'
        type: array
      size_bytes:
        type: integer
        x-nullable: true
    type: object
  coremetrics.DatabaseBucket:
    properties:
      ping_p95_ms:
        type: number
        x-nullable: true
      pool_in_use:
        type: integer
        x-nullable: true
      start:
        type: string
    type: object
  coremetrics.Execution:
    properties:
      connected_daemons:
        type: integer
        x-nullable: true
      in_progress_turns:
        type: integer
        x-nullable: true
      interrupted:
        type: integer
        x-nullable: true
      oldest_queued_seconds:
        type: number
        x-nullable: true
      queue_wait_ms:
        $ref: '#/definitions/coremetrics.Latency'
      queued_turns:
        type: integer
        x-nullable: true
      series:
        items:
          $ref: '#/definitions/coremetrics.ExecutionBucket'
        type: array
      slots_in_use:
        type: integer
        x-nullable: true
      slots_total:
        type: integer
        x-nullable: true
      unavailable:
        type: integer
        x-nullable: true
      waiting_for_daemon:
        type: integer
        x-nullable: true
    type: object
  coremetrics.ExecutionBucket:
    properties:
      in_progress:
        type: integer
        x-nullable: true
      queue_wait_p95_ms:
        type: number
        x-nullable: true
      queued:
        type: integer
        x-nullable: true
      start:
        type: string
    type: object
  coremetrics.Job:
    properties:
      failed:
        type: integer
        x-nullable: true
      id:
        type: string
      last_run_at:
        type: string
        x-nullable: true
      processed:
        type: integer
        x-nullable: true
      status:
        type: string
    type: object
  coremetrics.Latency:
    properties:
      p50:
        type: number
        x-nullable: true
      p95:
        type: number
        x-nullable: true
    type: object
  coremetrics.Pool:
    properties:
      idle:
        type: integer
        x-nullable: true
      in_use:
        type: integer
        x-nullable: true
      max:
        type: integer
        x-nullable: true
    type: object
  coremetrics.Process:
    properties:
      cpu_cores:
        type: number
        x-nullable: true
      cpu_limit_cores:
        type: number
        x-nullable: true
      goroutines:
        type: integer
        x-nullable: true
      memory_bytes:
        type: integer
        x-nullable: true
      memory_limit_bytes:
        type: integer
        x-nullable: true
      rss_bytes:
        type: integer
        x-nullable: true
      series:
        items:
          $ref: '#/definitions/coremetrics.ProcessBucket'
        type: array
    type: object
  coremetrics.ProcessBucket:
    properties:
      cpu_cores:
        type: number
        x-nullable: true
      rss_bytes:
        type: integer
        x-nullable: true
      start:
        type: string
    type: object
  coremetrics.Range:
    properties:
      end:
        type: string
      resolution_seconds:
        type: integer
      start:
        type: string
    type: object
  coremetrics.ServiceState:
    properties:
      execution_owner:
        type: boolean
        x-nullable: true
      revision:
        type: string
        x-nullable: true
      started_at:
        type: string
        x-nullable: true
      status:
        type: string
    type: object
  coremetrics.View:
    properties:
      database:
        $ref: '#/definitions/coremetrics.Database'
      execution:
        $ref: '#/definitions/coremetrics.Execution'
      jobs:
        items:
          $ref: '#/definitions/coremetrics.Job'
        type: array
      object:
        type: string
      process:
        $ref: '#/definitions/coremetrics.Process'
      range:
        $ref: '#/definitions/coremetrics.Range'
      service:
        $ref: '#/definitions/coremetrics.ServiceState'
    type: object
  sandbox.DeploymentSpec:
    properties:
      resources:
        $ref: '#/definitions/sandbox.Resources'
      runtime:
        $ref: '#/definitions/sandbox.RuntimeRelease'
    type: object
  sandbox.Resources:
    properties:
      cpus:
        type: integer
      environment_disk_mib:
        type: integer
      memory_mib:
        type: integer
      root_disk_mib:
        type: integer
    type: object
  sandbox.RuntimeRelease:
    properties:
      firmware_sha256:
        type: string
      image_id:
        type: string
      image_manifest_digest:
        type: string
      microsandbox_ref:
        type: string
      runtime_sha256:
        type: string
      source_commit:
        type: string
    type: object
  store.AddressBindings:
    properties:
      hosted_sandboxes:
        type: integer
      nodes:
        type: integer
      nodes_on_other_address:
        type: integer
      self_hosted_executors:
        type: integer
    type: object
  store.AdminAssetCounts:
    properties:
      agents:
        type: integer
      credentials:
        type: integer
      environment_templates:
        type: integer
      files:
        type: integer
      skills:
        type: integer
      vaults:
        type: integer
    type: object
  store.AdminAuditOperation:
    properties:
      action:
        type: string
      actor_label:
        type: string
      admin_credential_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      project_id:
        type: string
        x-nullable: true
      request_id:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      result_ids:
        items:
          type: object
        type: array
      trace_id:
        type: string
    type: object
  store.AdminAuditPage:
    properties:
      data:
        items:
          $ref: '#/definitions/store.AdminAuditOperation'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
    type: object
  store.AuditAPIKey:
    properties:
      id:
        type: string
      kind:
        type: string
      name:
        type: string
      prefix:
        type: string
      revoked_at:
        type: string
    type: object
  store.ExecutorCredential:
    properties:
      created_at:
        type: string
      key_id:
        format: uuid
        type: string
      revoked_at:
        type: string
        x-nullable: true
    type: object
  store.IssuedExecutorCredential:
    properties:
      environment_id:
        type: string
      executor_token:
        type: string
      key_id:
        type: string
    type: object
  store.IssuedProjectAPIKey:
    properties:
      created_at:
        type: string
      id:
        type: string
      key:
        type: string
      name:
        type: string
      prefix:
        type: string
      project_id:
        type: string
      revoked_at:
        type: string
    type: object
  store.ManagedSessionArchive:
    properties:
      environment_id:
        type: string
      session_id:
        type: string
      state:
        type: string
    type: object
  store.NodeHostHistory:
    properties:
      points:
        items:
          $ref: '#/definitions/store.NodeHostHistoryPoint'
        type: array
      resolution_seconds:
        type: integer
    type: object
  store.NodeHostHistoryPoint:
    properties:
      available_disk_bytes_min:
        type: integer
        x-nullable: true
      cpu_utilization_max:
        type: number
        x-nullable: true
      memory_used_bytes_max:
        type: integer
        x-nullable: true
      start:
        type: string
    type: object
  store.Project:
    properties:
      active_key_count:
        type: integer
      archived_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  store.ProjectAPIKey:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      prefix:
        type: string
      project_id:
        type: string
      revoked_at:
        type: string
    type: object
  store.ProjectAPIKeyPage:
    properties:
      data:
        items:
          $ref: '#/definitions/store.ProjectAPIKey'
        type: array
      has_more:
        type: boolean
    type: object
  store.ProjectPage:
    properties:
      data:
        items:
          $ref: '#/definitions/store.Project'
        type: array
      has_more:
        type: boolean
    type: object
  store.ResourceOwner:
    properties:
      admin_audit_id:
        type: string
      api_key:
        $ref: '#/definitions/store.AuditAPIKey'
      resource_id:
        type: string
      source:
        type: string
    type: object
  store.RuntimeDeploymentView:
    properties:
      core_url:
        description: 'Read-only: the installation public URL (AGENTS_API_PUBLIC_URL), which nodes and sandboxes use to reach Core. The deployment API does not accept it.'
        type: string
      e2b:
        $ref: '#/definitions/store.SandboxE2BView'
      generation:
        type: integer
      installation_id:
        type: string
      maintenance:
        type: boolean
      mode:
        type: string
      owner_epoch:
        type: integer
      provider:
        type: string
      resources:
        $ref: '#/definitions/store.SandboxDeploymentResources'
      specification:
        $ref: '#/definitions/sandbox.DeploymentSpec'
      specification_digest:
        type: string
      suspension:
        allOf:
          - $ref: '#/definitions/store.SandboxSuspensionView'
        description: Idle suspension policy; microsandbox only, otherwise null.
        x-nullable: true
    type: object
  store.RuntimeNode:
    properties:
      active:
        type: integer
      available_disk_bytes:
        type: integer
      available_memory_bytes:
        type: integer
      cleanup_pending:
        type: integer
      core_url:
        description: |-
          The Core address this node enrolled with. A node whose address differs
          from the installation public URL receives no new sandboxes; re-add it.
        type: string
      cpu_count:
        type: integer
      created_at:
        type: string
      diagnostic:
        description: Fixed reason for the last reported unreadiness; absent while the provider is ready. Clients treat an unknown value as provider_unavailable.
        enum:
          - provider_unavailable
          - docker_unavailable
          - docker_limits_unsupported
          - runtime_image_unavailable
          - kvm_unavailable
          - microsandbox_artifacts_unavailable
          - capacity_insufficient
        type: string
      enrollment_id:
        description: The enrollment_id of the command that registered this node (POST /core/v1/sandbox/enrollment-tokens); null for nodes enrolled before Core recorded it.
        type: string
        x-nullable: true
      id:
        type: string
      last_seen_at:
        type: string
      max_active:
        type: integer
      max_retained:
        type: integer
      name:
        type: string
      online:
        type: boolean
      provider:
        type: string
      provider_ready:
        type: boolean
      reserved:
        type: integer
      retained:
        type: integer
      running:
        type: integer
      snapshots:
        type: integer
    type: object
  store.RuntimeNodeAllocation:
    properties:
      compute_phase:
        type: string
      compute_phase_changed_at:
        description: The time the allocation entered its current compute_phase, or null when unknown; an allocation that existed before Core recorded it reports null until its next phase change. For a suspended microsandbox allocation, this time plus the deployment's snapshot retention tells roughly when Core reclaims it.
        type: string
        x-nullable: true
      created_at:
        type: string
      diagnostic:
        type: string
      environment_id:
        type: string
      id:
        type: string
      initialization:
        type: string
      node_id:
        type: string
      session_id:
        type: string
      state:
        type: string
      tenant_id:
        type: string
    type: object
  store.RuntimeNodeDetail:
    properties:
      active:
        type: integer
      available_disk_bytes:
        type: integer
      available_memory_bytes:
        type: integer
      cleanup_pending:
        type: integer
      core_url:
        description: |-
          The Core address this node enrolled with. A node whose address differs
          from the installation public URL receives no new sandboxes; re-add it.
        type: string
      cpu_count:
        type: integer
      created_at:
        type: string
      diagnostic:
        description: Fixed reason for the last reported unreadiness; absent while the provider is ready. Clients treat an unknown value as provider_unavailable.
        enum:
          - provider_unavailable
          - docker_unavailable
          - docker_limits_unsupported
          - runtime_image_unavailable
          - kvm_unavailable
          - microsandbox_artifacts_unavailable
          - capacity_insufficient
        type: string
      enrollment_id:
        description: The enrollment_id of the command that registered this node (POST /core/v1/sandbox/enrollment-tokens); null for nodes enrolled before Core recorded it.
        type: string
        x-nullable: true
      history:
        $ref: '#/definitions/store.NodeHostHistory'
      host:
        $ref: '#/definitions/store.RuntimeNodeHost'
      id:
        type: string
      last_seen_at:
        type: string
      max_active:
        type: integer
      max_retained:
        type: integer
      name:
        type: string
      online:
        type: boolean
      provider:
        type: string
      provider_ready:
        type: boolean
      reserved:
        type: integer
      retained:
        type: integer
      running:
        type: integer
      snapshots:
        type: integer
    type: object
  store.RuntimeNodeHost:
    properties:
      available_disk_bytes:
        type: integer
        x-nullable: true
