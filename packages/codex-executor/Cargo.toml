[package]
name = "agents-api-codex-executor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "agents-api-codex-directory"
path = "src/bin/directory.rs"

[[bin]]
name = "agents-api-codex-write"
path = "src/bin/write.rs"

[[bin]]
name = "agents-api-workspace-export"
path = "src/bin/export.rs"

[dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
serde_json = "1"
sha2 = "=0.10.9"
tar = { version = "=0.4.46", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
